<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tennis Overlay</title>
    <link rel="stylesheet" href="/overlay.css">
  </head>
  <body>
    <main id="overlay" class="overlay">
      <aside class="left-rail">
        <section class="promo-block">
          <div class="promo-kicker">LIVE TENNIS</div>
          <div id="matchTitle" class="promo-title">Загрузка матча</div>
          <div id="matchStage" class="promo-meta">Подключение данных</div>
        </section>

        <section id="statsPanel" class="stats-panel">
          <div class="panel-head">
            <span>Статистика</span>
            <span id="statUpdated">--:--</span>
          </div>
          <div id="statsList" class="stats-list"></div>
        </section>

        <section id="chatPanel" class="chat-panel" hidden>
          <div class="panel-head">
            <span>Чат</span>
            <span>LIVE</span>
          </div>
          <div class="chat-line">Комментатор подключен.</div>
          <div class="chat-line">Оверлей готов к эфиру.</div>
          <div class="chat-line muted">Здесь можно вывести чат трансляции.</div>
        </section>

        <section class="brand-block">
          <span>БОЛЬШЕ!</span>
          <small>TENNIS STREAM</small>
        </section>
      </aside>

      <section class="video-zone">
        <div class="safe-label">VIDEO / COMMENTATOR AREA</div>
      </section>

      <section class="scorebug">
        <div id="tournament" class="scorebug-tournament">Tournament</div>
        <div id="playerHome" class="player-row">
          <span class="serve-dot"></span>
          <span class="player-name">Home</span>
          <span id="homeGames" class="score-cell">0</span>
          <span id="homePoint" class="point-cell">0</span>
        </div>
        <div id="playerAway" class="player-row">
          <span class="serve-dot"></span>
          <span class="player-name">Away</span>
          <span id="awayGames" class="score-cell">0</span>
          <span id="awayPoint" class="point-cell">0</span>
        </div>
      </section>

      <section class="ticker">
        <div id="tickerTrack" class="ticker-track">Загрузка новостей...</div>
      </section>
    </main>
    <script src="/overlay.js"></script>
  </body>
</html>
